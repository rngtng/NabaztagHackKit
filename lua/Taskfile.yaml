# NabaztagSDK — Lua (V2) track entrypoint.
#
# Every build runs inside Docker, so the only host requirements are Docker and
# Task (https://taskfile.dev). Self-contained, relocatable leaves, split by what
# they touch:
#   * firmware:*  — build the image + simulate it + flash/REPL on REAL hardware.
#   * boot:*      — the resident boot chunk baked into the image (firmware delegates).
#   * apps:*      — the Lua app sources: compile to bytecode, run in the sim.
#   * lib:*       — host-side Lua stdlib tests.
# (`task firmware:build` here == `cd firmware && task build`.) This root owns only
# the cross-leaf orchestration (verify, clean). Run `task` with no args to list.
version: '3'

includes:
  firmware: # Lua-successor firmware (Lua 5.4): build + simulate + real-hardware flash/REPL
    taskfile: ./firmware/Taskfile.yaml
  boot: # the resident boot chunk baked into the firmware image (lua:boot:compile)
    taskfile: ./boot/Taskfile.yaml
  apps: # the Lua app sources + no-hardware verbs (compile to bytecode, run in the sim)
    taskfile: ./apps/Taskfile.yaml
  lib: # pure-Lua standard libraries (auto-discovered); net/ is the first (#217)
    taskfile: ./lib/Taskfile.yaml
  simui: # browser UI for the simulator (#43): NiceGUI + embedded sim, one container
    taskfile: ./tools/simui/Taskfile.yaml

tasks:
  verify:
    desc: 'Definition of done for the Lua (V2) layer: docs reference only real tasks, the host C unit tests, the reactor unit tests and the lib unit tests pass, the firmware image builds (fails loudly on flash overflow), the bytecode pipeline round-trips (firmware:test golden transcript), a refused frame leaves the console in sync (firmware:test:desync, #308) and the workloads still compose under blocking work (firmware:test:sched, #283).'
    cmds:
      - task: check:docs      # cheap, fail-fast: catch stale task/`*.md` doc refs before the slow builds
      - task: check:eol       # cheap, fail-fast: the vendored net/ sources are still CRLF
      - task: firmware:test:host   # native C unit tests under ASan - no sim, seconds
      - task: boot:test            # host-lua unit tests for `sched`, the resident reactor
      - task: firmware:test:bytecode  # the only input surface: malformed bytecode must not kill the runtime
      - task: lib:test
      - task: firmware:build
      - task: firmware:test
      - task: firmware:test:desync  # #308: a refused frame must not leave the console reading its payload
      - task: firmware:test:inject
      - task: firmware:test:sched  # #283: events, choreography and blocking work must still overlap

  check:docs:
    desc: 'Lint: every `task lua:…` command AND every `*.md` path written in docs/comments/skills resolves to something real - catches references left stale by a rename or a delete. Part of lua:verify.'
    dir: '{{.TASKFILE_DIR}}'
    silent: true
    cmds:
      - |
        set -e
        ROOT="$(git rev-parse --show-toplevel)"
        # Real task names, fully qualified (run the lister from the repo root).
        real="$(cd "$ROOT" && task --list-all --json | python3 -c 'import sys,json; print("\n".join(t["name"] for t in json.load(sys.stdin)["tasks"]))' | sort -u)"
        # `task lua:…` invocations referenced in docs/comments (strip trailing args +
        # a stray sentence colon). CHANGELOG is historical - past task names are
        # expected there, so it is excluded.
        refs="$(rg -oN --no-filename 'task (lua:[a-z0-9_:]+)' -r '$1' "$ROOT" -g '!*.lc' -g '!CHANGELOG.md' | sed 's/:$//' | sort -u)"
        missing="$(comm -23 <(printf '%s\n' "$refs") <(printf '%s\n' "$real"))"
        if [ -n "$missing" ]; then
          echo "✗ docs reference lua task(s) that do not exist (rename left them stale):"
          for m in $missing; do
            echo "    $m"
            rg -rn --no-heading "task $m" "$ROOT" -g '!*.lc' -g '!CHANGELOG.md' | sed 's/^/        /'
          done
          exit 1
        fi
        echo "✓ doc task-name check: every 'task lua:…' reference resolves"
      - |
        set -e
        ROOT="$(git rev-parse --show-toplevel)"
        cd "$ROOT"
        # Every `*.md` path written in a doc must exist. Doc *pointers* are how this
        # repo avoids restating the same rule in two places, so a pointer that rots
        # silently is what turns the split back into duplication - `NABAZTAG_SDK.md`
        # was cited as the home of all rationale long after it stopped existing.
        # CHANGELOG is historical (past paths are expected there), same as above.
        git ls-files -z -- '*.md' ':!CHANGELOG.md' | python3 -c '
        import os, re, sys

        # .md only: a bare `main.c` in prose is a filename, not a path, and linting
        # those just invents failures. A markdown LINK is held to how GitHub renders
        # it - relative to the citing file - because a link that only resolves from
        # the repo root is a 404 for a human reader. A backticked path is prose, so
        # either resolution counts.
        LINK = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
        QUOTED = re.compile(r"`([^`\s]+\.md(?:#[^`\s]*)?)`")
        missing = []
        for doc in sys.stdin.read().split("\0"):
            if not doc:
                continue
            text = open(doc, encoding="utf-8", errors="replace").read()
            for pattern, link in ((LINK, True), (QUOTED, False)):
                for raw in pattern.findall(text):
                    ref = raw.split("#", 1)[0]
                    # skip URLs and ~/ paths (the global CLAUDE.md is not in this repo)
                    if not ref.endswith(".md") or re.match(r"^(https?:|mailto:|~)", raw):
                        continue
                    cands = [os.path.join(os.path.dirname(doc), ref)]
                    if not link:
                        cands.append(ref.lstrip("/"))
                    if any(os.path.exists(p) for p in cands):
                        continue
                    missing.append((doc, raw, "link" if link else "ref"))
        if missing:
            print("✗ docs reference *.md path(s) that do not resolve:")
            for doc, raw, kind in missing:
                where = "relative to it (as GitHub renders)" if kind == "link" else "at all"
                print(f"    {doc}: {raw} - does not exist {where}")
            sys.exit(1)
        print("✓ doc path check: every *.md reference resolves")
        '

  check:eol:
    desc: 'Lint: no tracked file changed its line endings in the working tree - a scripted edit that rewrites a vendored CRLF file turns a small fix into a whole-file diff and destroys the backport bridge. Covers every tracked file, not a hand-kept list. Part of lua:verify.'
    dir: '{{.TASKFILE_DIR}}'
    silent: true
    cmds:
      - |
        set -e
        cd "$(git rev-parse --show-toplevel)"
        # 110 tracked files are CRLF (66 under mtl/firmware, 32 under lua/firmware,
        # 12 under mtl/tools). Python's read_text()/write_text() silently rewrites
        # them as LF; go through read_bytes()/write_bytes(). .gitattributes cannot
        # guard this - the damage happens in the working tree.
        #
        # Asked of git rather than counted by hand: `git ls-files --eol` reports the
        # index and worktree endings per file, so any file whose worktree endings no
        # longer match what is committed shows up as i/crlf w/lf. That covers every
        # tracked file including ones added later, where a hardcoded list silently
        # protects only what someone remembered to add to it - this started out
        # guarding 4 of the 110. Whole repo, ~60ms.
        report="$(git ls-files --eol | awk '
          {
            split($1, idx, "/"); split($2, work, "/")
            if (idx[2] != work[2]) {
              # $NF is the path; git pads the eol columns with spaces + a tab
              print "    " $NF ": committed as " idx[2] ", now " work[2]
              bad = 1
            }
          }
          END { exit bad ? 1 : 0 }
        ')" && rc=0 || rc=1
        if [ "$rc" != 0 ]; then
          echo "✗ tracked file(s) changed line endings in the working tree:"
          printf '%s\n' "$report"
          echo "    a scripted edit rewrote them - restore with: git checkout -- <path>"
          echo "    then redo the edit via read_bytes()/write_bytes(), not read_text()"
          exit 1
        fi
        echo "✓ line endings: all $(git ls-files | wc -l | tr -d ' ') tracked files match their committed endings"

  clean:
    desc: 'Clean all build artifacts and the layers'' Docker images.'
    cmds:
      - task: firmware:clean
